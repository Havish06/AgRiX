# Alembic Configuration
# Documentation: https://alembic.sqlalchemy.org/en/latest/configuration.html

[alembic]
# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Path to migration scripts
script_location = alembic

# Prepend sys.path with this directory
prepend_sys_path = .

# Database URL (will be overridden by env var)
sqlalchemy.url = sqlite+aiosqlite:///./AgRiX.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S